name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    env:
      # Firebase
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Cloudinary
      VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
      VITE_CLOUDINARY_PRODUCT_PRESET: ${{ secrets.VITE_CLOUDINARY_PRODUCT_PRESET }}
      VITE_CLOUDINARY_PROFILE_PRESET: ${{ secrets.VITE_CLOUDINARY_PROFILE_PRESET }}
      VITE_CLOUDINARY_TRANSACTION_PRESET: ${{ secrets.VITE_CLOUDINARY_TRANSACTION_PRESET }}
      VITE_CLOUDINARY_MESSAGE_PRESET: ${{ secrets.VITE_CLOUDINARY_MESSAGE_PRESET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify environment variables
        run: |
          echo "Checking required environment variables..."

          test -n "$VITE_FIREBASE_API_KEY" || (echo "ERROR: VITE_FIREBASE_API_KEY is missing" && exit 1)
          test -n "$VITE_FIREBASE_AUTH_DOMAIN" || (echo "ERROR: VITE_FIREBASE_AUTH_DOMAIN is missing" && exit 1)
          test -n "$VITE_FIREBASE_PROJECT_ID" || (echo "ERROR: VITE_FIREBASE_PROJECT_ID is missing" && exit 1)
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || (echo "ERROR: VITE_FIREBASE_STORAGE_BUCKET is missing" && exit 1)
          test -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" || (echo "ERROR: VITE_FIREBASE_MESSAGING_SENDER_ID is missing" && exit 1)
          test -n "$VITE_FIREBASE_APP_ID" || (echo "ERROR: VITE_FIREBASE_APP_ID is missing" && exit 1)
          test -n "$VITE_FIREBASE_MEASUREMENT_ID" || (echo "ERROR: VITE_FIREBASE_MEASUREMENT_ID is missing" && exit 1)

          test -n "$VITE_CLOUDINARY_CLOUD_NAME" || (echo "ERROR: VITE_CLOUDINARY_CLOUD_NAME is missing" && exit 1)
          test -n "$VITE_CLOUDINARY_PRODUCT_PRESET" || (echo "ERROR: VITE_CLOUDINARY_PRODUCT_PRESET is missing" && exit 1)
          test -n "$VITE_CLOUDINARY_PROFILE_PRESET" || (echo "ERROR: VITE_CLOUDINARY_PROFILE_PRESET is missing" && exit 1)
          test -n "$VITE_CLOUDINARY_TRANSACTION_PRESET" || (echo "ERROR: VITE_CLOUDINARY_TRANSACTION_PRESET is missing" && exit 1)
          test -n "$VITE_CLOUDINARY_MESSAGE_PRESET" || (echo "ERROR: VITE_CLOUDINARY_MESSAGE_PRESET is missing" && exit 1)

          echo "All required environment variables are present."

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4